                </header>
                <div class="lyricsViewerContent">

                    <aside class="lyricsPlayback" aria-labelledby="lyricsPlaybackTitle">
                        <h3 id="lyricsPlaybackTitle">Listen to the album</h3>
                        <p class="lyricsPlaybackNote" id="lyricsPlaybackNote"></p>
                        <div class="lyricsPlayerOptions" id="lyricsPlayerOptions" role="group" aria-label="Choose a music platform">
                            <button class="lyricsPlayerOption" type="button" data-player="spotify" aria-pressed="true">Spotify</button>
                            <button class="lyricsPlayerOption" type="button" data-player="appleMusic" aria-pressed="false">Apple Music</button>
                            <button class="lyricsPlayerOption" type="button" data-player="youtubeMusic" aria-pressed="false">YouTube Music</button>
                        </div>
                        <iframe class="lyricsPlayerFrame" id="lyricsPlayerFrame" title="Album player" loading="lazy"
