<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lyrics</title>
    <link rel="stylesheet" href="../STYLES/style.css">
</head>
<body class="lyricsSite">
    <header class="siteHeader">
        <a class="siteBrand" href="index.html">SYRYX</a>
        <nav aria-label="Main navigation">
            <a href="song.html" aria-current="page">Songs</a>
            <a href="music.html">Listen</a>
        </nav>
    </header>

    <main class="musicPage lyricsPage" id="pageTop">
        <article class="lyricsContent">
            <header class="lyricsIntro">
                <p class="musicEyebrow">MUSIC · ROCK · SOUND · IDENTITY</p>
                <h1>Lyrics</h1>
                <p class="lyricsLead">Explore the words behind the music of SYRYX.</p>
            </header>

            <figure class="lyricsArtwork">
                <img src="../images/portada.jpeg" alt="SYRYX band artwork">
            </figure>

            <section class="platformGrid lyricsList" aria-label="Song lyrics">
                <button class="platformCard" type="button" data-lyrics="../LYRICS/LETRAS/Ashes%20in%20the%20Storm%20-%20copia.txt" data-title="Ashes in the Storm">
                    <span class="platformNumber">01 · LYRICS</span>
                    <span class="platformName">Ashes in the Storm</span>
                    <span class="platformArrow" aria-hidden="true">↓</span>
                </button>
                <button class="platformCard" type="button" data-lyrics="../LYRICS/LETRAS/I%20dont%20bend%20-%20copia.txt" data-title="I Don't Bend">
                    <span class="platformNumber">02 · LYRICS</span>
                    <span class="platformName">I Don't Bend</span>
                    <span class="platformArrow" aria-hidden="true">↓</span>
                </button>
                <button class="platformCard" type="button" data-lyrics="../LYRICS/LETRAS/I%20give%20my%20best%20-%20copia.txt" data-title="I Give My Best">
                    <span class="platformNumber">03 · LYRICS</span>
                    <span class="platformName">I Give My Best</span>
                    <span class="platformArrow" aria-hidden="true">↓</span>
                </button>
                <button class="platformCard" type="button" data-lyrics="../LYRICS/LETRAS/If%20I%E2%80%99m%20Brave%20Tonight.txt" data-title="If I'm Brave Tonight">
                    <span class="platformNumber">04 · LYRICS</span>
                    <span class="platformName">If I'm Brave Tonight</span>
                    <span class="platformArrow" aria-hidden="true">↓</span>
                </button>
                <button class="platformCard" type="button" data-lyrics="../LYRICS/LETRAS/Keep%20them%20weak.txt" data-title="Keep Them Weak">
                    <span class="platformNumber">05 · LYRICS</span>
                    <span class="platformName">Keep Them Weak</span>
                    <span class="platformArrow" aria-hidden="true">↓</span>
                </button>
                <button class="platformCard" type="button" data-lyrics="../LYRICS/LETRAS/Maybe%20Was%20a%20Lie.txt" data-title="Maybe Was a Lie">
                    <span class="platformNumber">06 · LYRICS</span>
                    <span class="platformName">Maybe Was a Lie</span>
                    <span class="platformArrow" aria-hidden="true">↓</span>
                </button>
                <button class="platformCard" type="button" data-lyrics="../LYRICS/LETRAS/SAW%20YOU.txt" data-title="Saw You">
                    <span class="platformNumber">07 · LYRICS</span>
                    <span class="platformName">Saw You</span>
                    <span class="platformArrow" aria-hidden="true">↓</span>
                </button>
                <button class="platformCard" type="button" data-lyrics="../LYRICS/LETRAS/Talking%20to%20the%20Walls.txt" data-title="Talking to the Walls">
                    <span class="platformNumber">08 · LYRICS</span>
                    <span class="platformName">Talking to the Walls</span>
                    <span class="platformArrow" aria-hidden="true">↓</span>
                </button>
                <button class="platformCard" type="button" data-lyrics="../LYRICS/LETRAS/Velvet.txt" data-title="Velvet">
                    <span class="platformNumber">09 · LYRICS</span>
                    <span class="platformName">Velvet</span>
                    <span class="platformArrow" aria-hidden="true">↓</span>
                </button>
                <button class="platformCard" type="button" data-lyrics="../LYRICS/LETRAS/Your%20Ghost%20Bleeds.txt" data-title="Your Ghost Bleeds">
                    <span class="platformNumber">10 · LYRICS</span>
                    <span class="platformName">Your Ghost Bleeds</span>
                    <span class="platformArrow" aria-hidden="true">↓</span>
                </button>
            </section>

            <section class="lyricsViewer" id="lyricsViewer" aria-labelledby="selectedLyricsTitle" hidden>
                <header class="lyricsViewerHeader">
                    <div>
                        <p class="platformNumber">NOW READING</p>
                        <h2 id="selectedLyricsTitle" aria-live="polite"></h2>
                    </div>
                    <button class="lyricsClose" id="closeLyrics" type="button">Close</button>
                </header>
                <iframe class="lyricsFrame" id="lyricsFrame" title="Song lyrics"></iframe>
            </section>
        </article>
    </main>

    <a class="scrollTopButton" href="#pageTop" aria-label="Volver arriba" title="Volver arriba">↑</a>
    <script src="../REQUIREMENTS/lyrics.js"></script>
</body>
</html>
