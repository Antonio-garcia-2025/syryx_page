<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Music | SYRYX</title>
    <link rel="stylesheet" href="../STYLES/style.css">
</head>
<body>
    <header class="siteHeader">

        <nav aria-label="Main navigation">

            <a href="music.html" aria-current="page">Listen</a>
        </nav>
    </header>

    <main class="musicPage">
        <section class="musicContent" aria-labelledby="musicTitle">
            <p class="musicEyebrow">FIND YOUR FREQUENCY</p>
            <h1 id="musicTitle">Listen to <span>SYRYX</span></h1>
            <p class="musicIntro">Stream our music on your favorite platform.</p>

            <div class="platformGrid">
                <a class="platformCard" href="https://open.spotify.com/intl-es/artist/2gIdzU7shlTTTOlclOcjxy?si=xu6wTSMdQ165NMiJLnVshw" target="_blank" rel="noopener noreferrer">
                    <span class="platformNumber">01</span>
                    <svg class="platformIcon spotifyIcon" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
                        <circle cx="16" cy="16" r="16" fill="currentColor"/>
                        <path d="M7.1 11.7c5.8-1.8 12.9-1.2 18 2" fill="none" stroke="#101010" stroke-linecap="round" stroke-width="2.2"/>
                        <path d="M8.2 16.1c5-1.5 10.8-.9 15.2 1.8" fill="none" stroke="#101010" stroke-linecap="round" stroke-width="2"/>
                        <path d="M9.3 20.2c4.1-1.2 8.6-.7 12.1 1.5" fill="none" stroke="#101010" stroke-linecap="round" stroke-width="1.8"/>
                    </svg>
                    <span class="platformName">Spotify</span>
                    <span class="platformArrow" aria-hidden="true">↗</span>
                </a>
                <a class="platformCard" href="https://music.apple.com/mx/album/ashes-in-the-storm/6783036983" target="_blank" rel="noopener noreferrer">
                    <span class="platformNumber">02</span>
                    <svg class="platformIcon appleMusicIcon" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
                        <path d="M19.2 5.2v16.1a4.1 4.1 0 1 1-2-3.5V9.1l10-2.2v12.2a4.1 4.1 0 1 1-2-3.5V4.5L19.2 5.2Z" fill="currentColor"/>

                    <span class="platformName">Apple Music</span>
                    <span class="platformArrow" aria-hidden="true">↗</span>
                </a>
                <a class="platformCard" href="https://music.youtube.com/channel/UCFb9uXZjPqXJfFdnVvm2i3A" target="_blank" rel="noopener noreferrer">
                    <span class="platformNumber">03</span>
                    <svg class="platformIcon youtubeMusicIcon" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
                        <circle cx="16" cy="16" r="13.5" fill="none" stroke="currentColor" stroke-width="2.5"/>
                        <path d="m13 10.5 9 5.5-9 5.5v-11Z" fill="currentColor"/>
                    </svg>
                    <span class="platformName">YouTube Music</span>
                    <span class="platformArrow" aria-hidden="true">↗</span>
